backend:
  name: github
  repo: YOUR-GITHUB-USERNAME/quickreplies
  branch: main

media_folder: "content/uploads"
public_folder: "/content/uploads"

collections:
  - name: "replies"
    label: "Quick Replies"
    files:
      - name: "snippets"
        label: "All Categories"
        file: "content/snippets.json"
        fields:
          - label: "Categories"
            name: "categories"
            widget: "list"
            summary: "{{name}}"
            fields:
              - {label: "Category name", name: "name", widget: "string"}
              - label: "Snippets"
                name: "snippets"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - {label: "Title (short label, not sent to the client)", name: "title", widget: "string"}
                  - {label: "Text (this is what gets copied)", name: "text", widget: "text"}
