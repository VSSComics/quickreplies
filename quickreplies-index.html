<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickReplies — Шаблоны ответов</title>
<script defer src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
<script>
  window.addEventListener('load', () => {
    if (window.netlifyIdentity && window.location.hash && window.location.hash.includes('token')) {
      window.netlifyIdentity.open();
    }
  });
</script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root{
  --paper:#EDEAE0;
  --paper-card:#F5F3EC;
  --paper-shadow:#DAD5C4;
  --ink:#211F1A;
  --ink-soft:#57544A;
  --ink-faint:#8B8778;
  --line:#CDC7B2;
  --stamp:#B23A2E;
  --stamp-dark:#8F2D23;
  --teal:#2F6E62;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  background:
    repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(0,0,0,0.02) 40px),
    var(--paper);
  color:var(--ink);
  font-family:'IBM Plex Sans', sans-serif;
  min-height:100vh;
}
::selection{ background:var(--stamp); color:#fff; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; }
input{ font-family:inherit; }

/* ---- header ---- */
header{
  padding:26px 5vw 20px;
  border-bottom:2px solid var(--ink);
  display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:10px;
}
.brand{ display:flex; align-items:baseline; gap:12px; }
.brand-mark{
  font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:0.72rem;
  color:var(--paper); background:var(--ink); padding:4px 8px; border-radius:3px; letter-spacing:0.06em;
}
.brand h1{ font-size:1.35rem; font-weight:700; letter-spacing:-0.01em; }
.brand-sub{ font-family:'IBM Plex Mono', monospace; font-size:0.72rem; color:var(--ink-faint); letter-spacing:0.03em; }

/* ---- layout ---- */
.layout{ display:grid; grid-template-columns:220px 1fr; gap:0; }

.index-rail{
  padding:26px 0 60px 5vw;
  border-right:1px dashed var(--line);
}
.index-label{
  font-family:'IBM Plex Mono', monospace; font-size:0.66rem; text-transform:uppercase; letter-spacing:0.14em;
  color:var(--ink-faint); margin-bottom:14px; padding-right:16px;
}
.index-tab{
  display:block; width:100%; text-align:left;
  font-family:'IBM Plex Mono', monospace; font-size:0.86rem; font-weight:600;
  padding:11px 16px 11px 14px; margin-bottom:2px; border-radius:6px 0 0 6px;
  color:var(--ink-soft); position:relative;
  transition:background 0.15s, color 0.15s;
}
.index-tab:hover{ background:rgba(178,58,46,0.06); color:var(--ink); }
.index-tab.active{
  background:var(--paper-card); color:var(--ink); font-weight:700;
  box-shadow:inset 3px 0 0 var(--stamp);
}
.index-tab .count{ color:var(--ink-faint); font-weight:500; font-size:0.78rem; margin-left:6px; }

/* ---- main ---- */
main{ padding:30px 5vw 100px 4vw; max-width:760px; }

.category-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; flex-wrap:wrap; gap:10px; }
.category-head h2{ font-size:1.55rem; font-weight:700; letter-spacing:-0.01em; }
.category-head .tally{ font-family:'IBM Plex Mono', monospace; font-size:0.76rem; color:var(--ink-faint); }

.snippet-card{
  background:var(--paper-card);
  border:1px solid var(--line);
  border-radius:4px;
  box-shadow:2px 3px 0 var(--paper-shadow);
  padding:20px 22px;
  margin-bottom:16px;
  position:relative;
  overflow:hidden;
}
.snippet-title{ font-weight:700; font-size:1rem; margin-bottom:8px; }
.snippet-text{
  color:var(--ink-soft); font-size:0.92rem; line-height:1.65; white-space:pre-wrap;
  max-height:5.7em; overflow:hidden; position:relative;
}
.snippet-text.expanded{ max-height:none; }
.snippet-text:not(.expanded)::after{
  content:""; position:absolute; bottom:0; left:0; right:0; height:2.2em;
  background:linear-gradient(transparent, var(--paper-card));
}
.snippet-actions{ display:flex; align-items:center; gap:14px; margin-top:14px; }
.copy-btn{
  font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:0.78rem; letter-spacing:0.03em;
  color:var(--paper); background:var(--ink); padding:9px 18px; border-radius:5px;
  display:inline-flex; align-items:center; gap:8px; transition:background 0.15s, transform 0.1s;
}
.copy-btn:hover{ background:var(--stamp-dark); }
.copy-btn:active{ transform:scale(0.97); }
.expand-btn{ font-family:'IBM Plex Mono', monospace; font-size:0.76rem; color:var(--ink-faint); text-decoration:underline; text-underline-offset:3px; }
.expand-btn:hover{ color:var(--ink); }

.stamp-mark{
  position:absolute; top:14px; right:18px;
  font-family:'IBM Plex Mono', monospace; font-weight:800; font-size:0.95rem; letter-spacing:0.08em;
  color:var(--stamp); border:2.5px solid var(--stamp); padding:4px 10px; border-radius:4px;
  transform:rotate(-9deg) scale(0.6); opacity:0; text-transform:uppercase;
  pointer-events:none;
}
.stamp-mark.fire{
  animation: stampIn 0.55s cubic-bezier(.2,1.4,.4,1) forwards, stampOut 0.4s ease 1.1s forwards;
}
@keyframes stampIn{
  0%{ transform:rotate(-9deg) scale(2.2); opacity:0; }
  55%{ transform:rotate(-9deg) scale(0.92); opacity:1; }
  100%{ transform:rotate(-9deg) scale(1); opacity:1; }
}
@keyframes stampOut{ to{ opacity:0; } }

.empty-cat{ color:var(--ink-faint); font-size:0.9rem; padding:20px 2px; }
.load-msg{ color:var(--ink-faint); font-size:0.9rem; padding:40px 2px; }

@media (max-width:720px){
  .layout{ grid-template-columns:1fr; }
  .index-rail{
    display:flex; overflow-x:auto; gap:6px; padding:16px 5vw; border-right:none; border-bottom:1px dashed var(--line);
  }
  .index-label{ display:none; }
  .index-tab{ white-space:nowrap; border-radius:6px; flex-shrink:0; }
  .index-tab.active{ box-shadow:inset 0 -3px 0 var(--stamp); }
  main{ padding:24px 5vw 100px; }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="brand-mark">QR</span>
    <div>
      <h1>QuickReplies</h1>
      <div class="brand-sub">шаблоны ответов на почту</div>
    </div>
  </div>
</header>

<div class="layout">
  <nav class="index-rail" id="indexRail">
    <div class="index-label">Категории</div>
  </nav>
  <main id="mainArea">
    <div class="load-msg">Загрузка…</div>
  </main>
</div>

<script>
let DATA = { categories: [] };
let activeCategory = null;

fetch('content/snippets.json')
  .then(r => r.json())
  .then(data => {
    DATA = data;
    activeCategory = (DATA.categories[0] && DATA.categories[0].name) || null;
    renderRail();
    renderMain();
  })
  .catch(err => {
    console.error(err);
    document.getElementById('mainArea').innerHTML = '<div class="load-msg">Не удалось загрузить шаблоны. Обновите страницу.</div>';
  });

function renderRail(){
  const rail = document.getElementById('indexRail');
  rail.innerHTML = '<div class="index-label">Категории</div>';
  DATA.categories.forEach(cat=>{
    const btn = document.createElement('button');
    btn.className = 'index-tab' + (cat.name === activeCategory ? ' active' : '');
    btn.innerHTML = escapeHtml(cat.name) + '<span class="count">' + (cat.snippets||[]).length + '</span>';
    btn.onclick = ()=>{ activeCategory = cat.name; renderRail(); renderMain(); };
    rail.appendChild(btn);
  });
}

function renderMain(){
  const main = document.getElementById('mainArea');
  const cat = DATA.categories.find(c=>c.name===activeCategory);
  if(!cat){ main.innerHTML = '<div class="load-msg">Добавьте категорию в админке.</div>'; return; }
  main.innerHTML = '';

  const head = document.createElement('div');
  head.className = 'category-head';
  head.innerHTML = `<h2>${escapeHtml(cat.name)}</h2><span class="tally">${(cat.snippets||[]).length} шаблон(ов)</span>`;
  main.appendChild(head);

  if(!cat.snippets || cat.snippets.length === 0){
    main.innerHTML += '<div class="empty-cat">В этой категории пока нет шаблонов.</div>';
    return;
  }

  cat.snippets.forEach((sn, i)=>{
    const card = document.createElement('div');
    card.className = 'snippet-card';
    card.innerHTML = `
      <div class="snippet-title">${escapeHtml(sn.title)}</div>
      <div class="snippet-text" id="text-${i}">${escapeHtml(sn.text)}</div>
      <div class="snippet-actions">
        <button class="copy-btn" data-i="${i}">Скопировать</button>
        <button class="expand-btn" data-i="${i}">показать полностью</button>
      </div>
      <div class="stamp-mark" id="stamp-${i}">Скопировано</div>
    `;
    main.appendChild(card);

    card.querySelector('.copy-btn').onclick = ()=> copySnippet(sn.text, i);
    card.querySelector('.expand-btn').onclick = (e)=>{
      const textEl = document.getElementById('text-' + i);
      const expanded = textEl.classList.toggle('expanded');
      e.target.textContent = expanded ? 'свернуть' : 'показать полностью';
    };
  });
}

function copySnippet(text, i){
  navigator.clipboard.writeText(text).then(()=>{
    const stamp = document.getElementById('stamp-' + i);
    stamp.classList.remove('fire');
    void stamp.offsetWidth;
    stamp.classList.add('fire');
  }).catch(()=>{
    alert('Не удалось скопировать. Скопируйте текст вручную.');
  });
}

function escapeHtml(str){
  return (str||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
</script>
</body>
</html>
